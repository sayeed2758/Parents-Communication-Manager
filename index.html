html,body{margin:0;background:#f6f8fc;color:#142033;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}button,input,select,textarea{font:inherit}button{cursor:pointer}.app-shell{min-height:100vh;display:flex}.sidebar{width:270px;flex:0 0 270px;background:#fff;border-right:1px solid #e5eaf2}.main{flex:1;min-width:0}.topbar{height:72px;background:#fff;border-bottom:1px solid #e5eaf2;display:flex;align-items:center;padding:0 22px;gap:15px;position:sticky;top:0;z-index:20}.content{padding:24px;max-width:1500px;margin:auto}.card{background:#fff;border:1px solid #e5eaf2;border-radius:18px;padding:18px;box-shadow:0 8px 26px rgba(24,40,72,.06)}
