<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="description" content="Parent Communication Manager Pro for teachers">
<title>Parent Communication Manager Pro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="toastRoot" class="toast-root"></div>

<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">PC</div>
      <div><strong>ParentComm</strong><span>Manager Pro</span></div>
    </div>
    <nav id="nav">
      <button class="nav-item active" data-view="dashboard">⌂ <span>Dashboard</span></button>
      <button class="nav-item" data-view="students">👨‍🎓 <span>Students & Parents</span></button>
      <button class="nav-item" data-view="compose">💬 <span>New Message</span></button>
      <button class="nav-item" data-view="templates">🧩 <span>Templates</span></button>
      <button class="nav-item" data-view="announcements">📢 <span>Announcements</span></button>
      <button class="nav-item" data-view="followups">🔔 <span>Follow-ups</span></button>
      <button class="nav-item" data-view="history">🕘 <span>History</span></button>
      <button class="nav-item" data-view="analytics">📊 <span>Analytics</span></button>
      <button class="nav-item" data-view="backup">💾 <span>Backup & Reports</span></button>
    </nav>
    <div class="sidebar-bottom">
      <button class="nav-item" data-view="settings">⚙ <span>Settings</span></button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn mobile-menu" id="mobileMenu">☰</button>
      <div>
        <div class="eyebrow" id="pageEyebrow">Teacher Productivity</div>
        <h1 id="pageTitle">Dashboard</h1>
      </div>
      <div class="top-actions">
        <span id="liveDate" class="live-date"></span>
        <button class="icon-btn" id="themeBtn" title="Toggle theme">◐</button>
        <button class="avatar" id="teacherAvatar">S</button>
      </div>
    </header>

    <section id="view-dashboard" class="view active"></section>
    <section id="view-students" class="view"></section>
    <section id="view-compose" class="view"></section>
    <section id="view-templates" class="view"></section>
    <section id="view-announcements" class="view"></section>
    <section id="view-followups" class="view"></section>
    <section id="view-history" class="view"></section>
    <section id="view-analytics" class="view"></section>
    <section id="view-backup" class="view"></section>
    <section id="view-settings" class="view"></section>
  </main>
</div>

<div id="modalRoot"></div>
<script src="assets/js/app.js"></script><script>if("serviceWorker" in navigator && location.protocol!=="file:"){navigator.serviceWorker.register("sw.js").catch(()=>{});}</script>
</body>
</html>
